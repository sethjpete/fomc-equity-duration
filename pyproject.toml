[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fomcdur"
version = "0.1.0"
description = "Effective equity duration around FOMC surprises and post-announcement drift"
authors = [
  { name = "Seth Peterson" },
  { name = "Kenzo Ota von Steun" },
  { name = "Grigorios Chatziandreou" },
]
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14",
  "requests>=2.31",
  "openpyxl>=3.1",
  "wrds>=3.2",          # CRSP/Compustat pulls; pins pandas to 2.2.x
  "tabulate>=0.9",
  "python-dotenv>=1.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
wrds = []  # kept so `pip install -e ".[wrds,dev]"` still works; wrds is now a core dependency
dev = ["pytest>=8", "ruff>=0.4", "jupyterlab>=4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
