# Project-wide settings. Paths are relative to the repo root unless absolute.

[sample]
start = "1994-01-01"
# Main sample ends with the SF Fed file (last surprise 2023-12-13; decided 2026-11-17).
# Extend when the SF Fed adds 2024-2025 surprises.
end = "2023-12-31"
# Raw CRSP/Compustat pulls run further, so post-event windows and a later
# extension to 2024-2025 need no new pull.
data_end = "2025-12-31"
max_horizon = 20          # trading days after the announcement
prespecified_horizons = [5, 20]

[universe]
share_codes = [10, 11]    # CRSP common shares
exchange_codes = [1, 2, 3]  # NYSE, AMEX, NASDAQ
microcap_nyse_pct = 20    # drop stocks below this NYSE ME percentile

[duration]
# Surprises are in percentage points in the SF Fed file; divide by 100 so that
# duration is in years (a 10bp surprise times D=10 is a 1% price move).
surprise_scale = 0.01
characteristics = ["log_me", "log_bm", "op_prof", "leverage"]
industry_scheme = "ff49"

[wrds]
# Legacy CRSP SIZ tables (crsp.dsf, dsenames, dsedelist) stop at the end of 2024.
# Years after this come from the CIZ table crsp.dsf_v2.
legacy_end_year = 2024

[strategy]
cost_bps_per_side = 10

[sources]
# Official FRED API; key from FRED_API_KEY in .env.
fred_api_url = "https://api.stlouisfed.org/fred/series/observations"
french_base = "https://mba.tuck.dartmouth.edu/pages/faculty/ken.french/ftp/"
# Linked from https://www.frbsf.org/research-and-insights/data-and-indicators/monetary-policy-surprises/
# (checked 2026-11-17; covers 1988-2023). Leave empty to read a manually saved
# file from data/raw/sffed/.
sffed_url = "https://www.frbsf.org/wp-content/uploads/monetary-policy-surprises-data.xlsx"
# Chen (2022, JFQA) posted stock-level effective duration estimates (SAS datasets).
chen_base = "https://chenzhanhui.people.ust.hk/"
